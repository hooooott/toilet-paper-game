<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>トイレペーパー ロングラン！</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #eef4fa;
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
      color: #111827;
    }
    #app {
      position: relative;
      width: 100%;
      max-width: 480px;
      height: 100dvh;
      margin: 0 auto;
      background: #f8fafc;
      overflow: hidden;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    .hud-top {
      position: absolute;
      top: 10px;
      left: 12px;
      right: 12px;
      z-index: 10;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      pointer-events: none;
    }
    .hud-item {
      background: rgba(255, 255, 255, 0.85);
      border-radius: 10px;
      padding: 6px 10px;
      line-height: 1.3;
      box-shadow: 0 2px 8px rgba(15, 23, 42, 0.06);
    }
    .hud-label {
      font-size: 11px;
      color: #475569;
      font-weight: 700;
    }
    .hud-num {
      font-size: 17px;
      font-weight: 800;
      color: #0f172a;
    }
    .durability-box {
      position: absolute;
      top: 66px;
      left: 12px;
      right: 12px;
      z-index: 10;
      background: rgba(255, 255, 255, 0.88);
      border-radius: 10px;
      padding: 6px 10px;
      pointer-events: none;
      box-shadow: 0 2px 8px rgba(15, 23, 42, 0.06);
    }
    .durability-top {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      font-weight: 700;
      margin-bottom: 4px;
    }
    .bar-track {
      width: 100%;
      height: 8px;
      background: #e2e8f0;
      border-radius: 999px;
      overflow: hidden;
    }
    .bar-value {
      width: 100%;
      height: 100%;
      background: #2563eb;
      transition: width 0.06s linear, background 0.15s ease;
    }
    .durability-sub {
      margin-top: 4px;
      font-size: 10px;
      color: #475569;
      text-align: center;
    }
    .home-overlay {
      position: absolute;
      inset: 0;
      z-index: 20;
      background: rgba(248, 250, 252, 0.92);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 20px;
      gap: 12px;
    }
    .home-overlay.hidden {
      display: none;
    }
    .title {
      margin: 0;
      font-size: 24px;
      font-weight: 900;
      line-height: 1.3;
      color: #0f172a;
    }
    .subtitle {
      margin: 0;
      font-size: 13px;
      color: #334155;
      font-weight: 600;
    }
    .info-card {
      width: 100%;
      text-align: left;
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      padding: 12px 14px;
      font-size: 12px;
      line-height: 1.65;
      color: #1e293b;
    }
    .play-btn {
      border: none;
      border-radius: 999px;
      padding: 13px 30px;
      font-size: 15px;
      font-weight: 800;
      color: #ffffff;
      background: #0f172a;
      cursor: pointer;
    }
    .play-btn:active {
      transform: scale(0.97);
    }
  </style>
</head>
<body>
  <div id="app">
    <div class="hud-top">
      <div class="hud-item">
        <div class="hud-label">のばした長さ</div>
        <div id="lenText" class="hud-num">0.0m</div>
      </div>
      <div class="hud-item" style="text-align: right;">
        <div class="hud-label">1位記録</div>
        <div id="bestText" class="hud-num">0
