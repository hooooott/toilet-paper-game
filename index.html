<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>トイレペーパー ロングラン！</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #e6eef5;
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
      color: #111827;
    }
    #app {
      position: relative;
      width: 100%;
      max-width: 480px;
      height: 100dvh;
      margin: 0 auto;
      background: #f8fafc;
      box-shadow: 0 0 24px rgba(0, 0, 0, 0.12);
      overflow: hidden;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    .top-hud {
      position: absolute;
      top: 10px;
      left: 12px;
      right: 12px;
      z-index: 10;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      pointer-events: none;
    }
    .stat-block {
      background: rgba(255, 255, 255, 0.88);
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      padding: 6px 10px;
      line-height: 1.3;
    }
    .stat-label {
      font-size: 11px;
      color: #475569;
      font-weight: 700;
    }
    .stat-value {
      font-size: 18px;
      font-weight: 800;
      color: #0f172a;
    }
    .status-panel {
      position: absolute;
      top: 68px;
      left: 12px;
      right: 12px;
      z-index: 10;
      background: rgba(255, 255, 255, 0.9);
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      padding: 7px 10px;
      pointer-events: none;
    }
    .status-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
      font-weight: 700;
      margin-bottom: 4px;
    }
    .gauge-bg {
      width: 100%;
      height: 8px;
      background: #e2e8f0;
      border-radius: 999px;
      overflow: hidden;
    }
    .gauge-fill {
      width: 100%;
      height: 100%;
      background: #2563eb;
      transition: width 0.06s linear, background 0.15s ease;
    }
    .hint-sub {
      margin-top: 4px;
      font-size: 10px;
      color: #475569;
      text-align: center;
    }
    .overlay {
      position: absolute;
      inset: 0;
      z-index: 20;
      background: rgba(248, 250, 252, 0.94);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 20px;
      gap: 12px;
    }
    .overlay.hidden {
      display: none;
    }
    h1 {
      margin: 0;
      font-size: 24px;
      line-height: 1.3;
      color: #0f172a;
    }
    .lead {
      margin: 0;
      font-size: 13px;
      color: #334155;
    }
    .guide-box {
      width: 100%;
      text-align: left;
      background: #ffffff;
      border: 1px solid #cbd5e1;
      border-radius: 12px;
      padding: 12px 14px;
      font-size: 12px;
      line-height: 1.65;
      color: #1e293b;
    }
    .start-btn {
      border: none;
      border-radius: 999px;
      padding: 13px 28px;
      font-size: 15px;
      font-weight: 800;
      color: #ffffff;
      background: #0f172a;
      cursor: pointer;
    }
    .start-btn:active {
      transform: scale(0.97);
    }
  </style>
</head>
<body>
  <div id="app">
    <div class="top-hud">
      <div class="stat-block">
        <div class="stat-label">のばした長さ</div>
        <div id="lenVal" class="stat-value">0.0m</div>
      </div>
      <div class="stat-block" style="text-align: right;">
        <div class="stat-label">1位記録</div>
        <div id="bestVal" class="stat-value">0.0m</div>
      </div>
    </div>

    <div class="status-panel">
      <div class="status-row">
        <span>🧻 紙の耐久度（ちぎれ注意・急操作NG！）</span>
        <span id="durVal">100%</span>
      </div>
      <div class="gauge-bg">
        <div id="durFill" class="gauge-fill"></div>
      </div>
      <div class="hint-sub">👆 左右にやさしくスライドして紙を伸ばそう！ちぎれたら即終了！スリルアクション</div>
    </div>

    <canvas id="paperCanvas"></canvas>

    <div id="startScreen" class="overlay">
      <h1>トイレペーパー ロングラン！</h1>
      <p class="lead">どこまで切らずに伸ばせるかな？</p>
      <div class="guide-box">
        👆 左右にスライドして紙を誘導（急な横移動は「ちぎれ注意」！）<br />
        🧻 紙が伸びるほどスピードアップ！やさしく操作しよう<br />
        💥 耐久度が0になったり、強く引っ張りすぎると即終了！
      </div>
      <button id="startAction" class="start-btn">スタート</button>
    </div>

    <div id="endScreen" class="overlay hidden">
      <h1 id="endMsg">紙がちぎれた！</h1>
      <p class="lead" id="endLen">のばした長さ：0.0m</p>
      <p class="lead" id="endBest">1位記録：0.0m</p>
      <button id="retryAction" class="start-btn">もう一度</button>
    </div>
  </div>

  <script>
    (() => {
      const app = document.getElementById("app");
      const canvas = document.getElementById("paperCanvas");
      const ctx = canvas.getContext("2d");

      const lenVal = document.getElementById("lenVal");
      const bestVal = document.getElementById("bestVal");
      const durVal = document.getElementById("durVal");
      const durFill = document.getElementById("durFill");

      const startScreen = document.getElementById("startScreen");
      const endScreen = document.getElementById("endScreen");
      const startAction = document.getElementById("startAction");
      const retryAction = document.getElementById("retryAction");
      const endMsg = document.getElementById("endMsg");
      const endLen = document.getElementById("endLen");
      const endBest = document.getElementById("endBest");

      const STORAGE_KEY = "tp_longrun_slide_best_v1";
      let bestScore = parseFloat(localStorage.getItem(STORAGE_KEY) || "0") || 0;
      bestVal.textContent = bestScore.toFixed(1) + "m";

      let viewW = 360;
      let viewH = 640;
      let dpr = 1;

      function fitCanvas() {
        const r = app.getBoundingClientRect();
        viewW = Math.max(280, r.width);
        viewH = Math.max(420, r.height);
        dpr = Math.min(window.devicePixelRatio || 1, 2);
        canvas.width = Math.floor(viewW * dpr);
        canvas.height = Math.floor(viewH * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      }
      fitCanvas();
      window.addEventListener("resize", fitCanvas);

      let phase = "ready"; // "ready" | "playing" | "ended"
      let lengthMeters = 0;
      let durability = 100;
      let pullSpeed = 160; // px/sec

      const paperW = 72;
      let tipX = viewW * 0.5;
      let targetTipX = viewW * 0.5;
      let prevTipX = viewW * 0.5;
      const tipY = () => Math.min(viewH * 0.75, viewH - 120);

      let guideWavePhase = 0;
      let lastTs = performance.now();

      function syncHud() {
        lenVal.textContent = lengthMeters.toFixed(1) + "m";
        if (lengthMeters > bestScore) {
          bestScore = lengthMeters;
          localStorage.setItem(STORAGE_KEY, bestScore.toFixed(1));
        }
        bestVal.textContent = bestScore.toFixed(1) + "m";

        const clamped = Math.max(0, Math.min(100, durability));
        durVal.textContent = Math.round(clamped) + "%";
        durFill.style.width = clamped + "%";
        if (clamped > 60) {
          durFill.style.background = "#2563eb";
        } else if (clamped > 30) {
          durFill.style.background = "#d97706";
        } else {
          durFill.style.background = "#dc2626";
        }
      }

      function resetState() {
        lengthMeters = 0;
        durability = 100;
        pullSpeed = 160;
        tipX = viewW * 0.5;
        targetTipX = viewW * 0.5;
        prevTipX = viewW * 0.5;
        guideWavePhase = 0;
        syncHud();
      }

      function beginPlay() {
        fitCanvas();
        resetState();
        phase = "playing";
        startScreen.classList.add("hidden");
        endScreen.classList.add("hidden");
      }

      function finishPlay(reasonText) {
        if (phase !== "playing") return;
        phase = "ended";
        syncHud();
        endMsg.textContent = reasonText || "紙がちぎれた！";
        endLen.textContent = "のばした長さ：" + lengthMeters.toFixed(1) + "m";
        endBest.textContent = "1位記録：" + bestScore.toFixed(1) + "m";
        endScreen.classList.remove("hidden");
      }

      startAction.addEventListener("click", beginPlay);
      retryAction.addEventListener("click", beginPlay);

      let isSliding = false;
      function updateTargetX(clientX) {
        const rect = canvas.getBoundingClientRect();
        const x = clientX - rect.left;
        const pad = paperW * 0.5 + 14;
        targetTipX = Math.max(pad, Math.min(viewW - pad, x));
      }

      canvas.addEventListener("pointerdown", (e) => {
        if (phase !== "playing") return;
        isSliding = true;
        updateTargetX(e.clientX);
      });
      window.addEventListener("pointermove", (e) => {
        if (!isSliding || phase !== "playing") return;
        updateTargetX(e.clientX);
      });
      window.addEventListener("pointerup", () => {
        isSliding = false;
      });

      const keyState = { left: false, right: false };
      window.addEventListener("keydown", (e) => {
        if (e.key === "ArrowLeft" || e.key === "a" || e.key === "A") keyState.left = true;
        if (e.key === "ArrowRight" || e.key === "d" || e.key === "D") keyState.right = true;
      });
      window.addEventListener("keyup", (e) => {
        if (e.key === "ArrowLeft" || e.key === "a" || e.key === "A") keyState.left = false;
        if (e.key === "ArrowRight" || e.key === "d" || e.key === "D") keyState.right = false;
      });

      function drawGrid() {
        ctx.fillStyle = "#f8fafc";
        ctx.fillRect(0, 0, viewW, viewH);

        const cell = 26;
        const scrollY = (lengthMeters * 55) % cell;
        ctx.strokeStyle = "#e2e8f0";
        ctx.lineWidth = 1;
        for (let x = 0; x <= viewW; x += cell) {
          ctx.beginPath();
          ctx.moveTo(x, 0);
          ctx.lineTo(x, viewH);
          ctx.stroke();
        }
        for (let y = scrollY; y <= viewH; y += cell) {
          ctx.beginPath();
          ctx.moveTo(0, y);
          ctx.lineTo(viewW, y);
          ctx.stroke();
        }
      }

      function drawPaperStrip() {
        const yEnd = tipY();
        const half = paperW * 0.5;

        // 上端（ロール元）から先端まで、なめらかに曲がる紙を描く
        const segments = 24;
        ctx.beginPath();
        for (let i = 0; i <= segments; i++) {
          const t = i / segments;
          const y = t * yEnd;
          // 紙の根元は中央付近、先端に向かって tipX へ滑らかにつながる
          const curve = t * t * (3 - 2 * t);
          const centerX = viewW * 0.5 * (1 - curve) + tipX * curve;
          const lx = centerX - half;
          if (i === 0) ctx.moveTo(lx, y);
          else ctx.lineTo(lx, y);
        }
        for (let i = segments; i >= 0; i--) {
          const t = i / segments;
          const y = t * yEnd;
          const curve = t * t * (3 - 2 * t);
          const centerX = viewW * 0.5 * (1 - curve) + tipX * curve;
          const rx = centerX + half;
          ctx.lineTo(rx, y);
        }
        ctx.closePath();

        ctx.fillStyle = durability < 30 ? "#fff1f2" : "#ffffff";
        ctx.fill();
        ctx.strokeStyle = durability < 30 ? "#e11d48" : "#64748b";
        ctx.lineWidth = 2;
        ctx.stroke();

        // ミシン目（点線）
        ctx.save();
        ctx.setLineDash([5, 5]);
        ctx.strokeStyle = "#cbd5e1";
        ctx.lineWidth = 1.5;
        const perfSpacing = 44;
        const perfOffset = (lengthMeters * 55) % perfSpacing;
        for (let y = perfOffset; y < yEnd; y += perfSpacing) {
          const t = y / yEnd;
          const curve = t * t * (3 - 2 * t);
          const cx = viewW * 0.5 * (1 - curve) + tipX * curve;
          ctx.beginPath();
          ctx.moveTo(cx - half + 6, y);
          ctx.lineTo(cx + half - 6, y);
          ctx.stroke();
        }
        ctx.restore();

        // 先端の紙ロール
        ctx.beginPath();
        ctx.ellipse(tipX, yEnd, half, 12, 0, 0, Math.PI * 2);
        ctx.fillStyle = "#f1f5f9";
        ctx.fill();
        ctx.strokeStyle = "#334155";
        ctx.lineWidth = 2;
        ctx.stroke();

        ctx.beginPath();
        ctx.ellipse(tipX, yEnd, 11, 5, 0, 0, Math.PI * 2);
        ctx.fillStyle = "#cbd5e1";
        ctx.fill();
      }

      function tick(now) {
        const dt = Math.min(0.05, (now - lastTs) / 1000);
        lastTs = now;

        if (phase === "playing") {
          if (keyState.left) targetTipX -= 260 * dt;
          if (keyState.right) targetTipX += 260 * dt;

          const pad = paperW * 0.5 + 14;
          targetTipX = Math.max(pad, Math.min(viewW - pad, targetTipX));

          prevTipX = tipX;
          tipX += (targetTipX - tipX) * Math.min(1, dt * 14);

          // 急な横移動によるダメージ判定
          const lateralSpeed = Math.abs(tipX - prevTipX) / Math.max(dt, 0.001);
          const safeLateralSpeed = 340;
          if (lateralSpeed > safeLateralSpeed) {
            const excess = lateralSpeed - safeLateralSpeed;
            durability -= excess * 0.055 * dt;
          } else {
            // やさしく動かしている間はわずかに回復
            durability = Math.min(100, durability + 3.5 * dt);
          }

          pullSpeed = Math.min(360, 160 + lengthMeters * 1.8);
          lengthMeters += (pullSpeed * dt) / 60;
          guideWavePhase += dt * 2.2;

          syncHud();

          if (durability <= 0) {
            finishPlay("急な横移動で紙がちぎれた！");
          }
        }

        drawGrid();
        drawPaperStrip();
        requestAnimationFrame(tick);
      }

      requestAnimationFrame(tick);
    })();
  </script>
</body>
</html>
