<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>トイレペーパー ロングラン！</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #e6eef5;
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
      color: #111827;
    }
    #app {
      position: relative;
      width: 100%;
      max-width: 480px;
      height: 100dvh;
      margin: 0 auto;
      background: #f8fafc;
      box-shadow: 0 0 24px rgba(0, 0, 0, 0.12);
      overflow: hidden;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    .hud-top {
      position: absolute;
      top: 10px;
      left: 12px;
      right: 12px;
      z-index: 10;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      pointer-events: none;
    }
    .hud-item {
      background: rgba(255, 255, 255, 0.88);
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      padding: 6px 10px;
      line-height: 1.3;
      box-shadow: 0 2px 8px rgba(15, 23, 42, 0.06);
    }
    .hud-label {
      font-size: 11px;
      color: #475569;
      font-weight: 700;
    }
    .hud-num {
      font-size: 17px;
      font-weight: 800;
      color: #0f172a;
    }
    .durability-box {
      position: absolute;
      top: 66px;
      left: 12px;
      right: 12px;
      z-index: 10;
      background: rgba(255, 255, 255, 0.9);
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      padding: 6px 10px;
      pointer-events: none;
      box-shadow: 0 2px 8px rgba(15, 23, 42, 0.06);
    }
    .durability-top {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      font-weight: 700;
      margin-bottom: 4px;
    }
    .bar-track {
      width: 100%;
      height: 8px;
      background: #e2e8f0;
      border-radius: 999px;
      overflow: hidden;
    }
    .bar-value {
      width: 100%;
      height: 100%;
      background: #2563eb;
      transition: width 0.06s linear, background 0.15s ease;
    }
    .durability-sub {
      margin-top: 4px;
      font-size: 10px;
      color: #475569;
      text-align: center;
    }
    .home-overlay {
      position: absolute;
      inset: 0;
      z-index: 20;
      background: rgba(248, 250, 252, 0.94);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 20px;
      gap: 12px;
    }
    .home-overlay.hidden {
      display: none;
    }
    .title {
      margin: 0;
      font-size: 24px;
      font-weight: 900;
      line-height: 1.3;
      color: #0f172a;
    }
    .subtitle {
      margin: 0;
      font-size: 13px;
      color: #334155;
      font-weight: 600;
    }
    .info-card {
      width: 100%;
      text-align: left;
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      padding: 12px 14px;
      font-size: 12px;
      line-height: 1.65;
      color: #1e293b;
    }
    .play-btn {
      border: none;
      border-radius: 999px;
      padding: 13px 30px;
      font-size: 15px;
      font-weight: 800;
      color: #ffffff;
      background: #0f172a;
      cursor: pointer;
    }
    .play-btn:active {
      transform: scale(0.97);
    }
  </style>
</head>
<body>
  <div id="app">
    <div class="hud-top">
      <div class="hud-item">
        <div class="hud-label">のばした長さ</div>
        <div id="lenText" class="hud-num">0.0m</div>
      </div>
      <div class="hud-item" style="text-align: right;">
        <div class="hud-label">1位記録</div>
        <div id="bestText" class="hud-num">0.0m</div>
      </div>
    </div>

    <div class="durability-box">
      <div class="durability-top">
        <span>🧻 紙の耐久度（ちぎれ注意・急操作NG！）</span>
        <span id="durText">100%</span>
      </div>
      <div class="bar-track">
        <div id="durBar" class="bar-value"></div>
      </div>
      <div class="durability-sub">👆 左右にやさしくスライドして紙を伸ばそう！ちぎれたら即終了！スリルアクション</div>
    </div>

    <canvas id="gameCanvas"></canvas>

    <div id="startOverlay" class="home-overlay">
      <h1 class="title">トイレペーパー ロングラン！</h1>
      <p class="subtitle">どこまで切らずに伸ばせるかな？</p>
      <div class="info-card">
        👆 左右にスライドして紙を誘導（急な横移動は「ちぎれ注意」！）<br />
        🐾 猫の手・💧 水の障害物に注意！<br />
        ⭐ 無敵スターでレインボー無敵化！障害物を吹き飛ばせる！
      </div>
      <button id="startBtn" class="play-btn">スタート</button>
    </div>

    <div id="endOverlay" class="home-overlay hidden">
      <h1 class="title" id="endTitle">紙がちぎれた！</h1>
      <p class="subtitle" id="endLen">のばした長さ：0.0m</p>
      <p class="subtitle" id="endBest">1位記録：0.0m</p>
      <button id="retryBtn" class="play-btn">もう一度</button>
    </div>
  </div>

  <script>
    (() => {
      const app = document.getElementById("app");
      const canvas = document.getElementById("gameCanvas");
      const ctx = canvas.getContext("2d");

      const lenText = document.getElementById("lenText");
      const bestText = document.getElementById("bestText");
      const durText = document.getElementById("durText");
      const durBar = document.getElementById("durBar");

      const startOverlay = document.getElementById("startOverlay");
      const endOverlay = document.getElementById("endOverlay");
      const startBtn = document.getElementById("startBtn");
      const retryBtn = document.getElementById("retryBtn");
      const endTitle = document.getElementById("endTitle");
      const endLen = document.getElementById("endLen");
      const endBest = document.getElementById("endBest");

      const BEST_KEY = "tp_longrun_cat_water_star_v1";
      let bestMeters = parseFloat(localStorage.getItem(BEST_KEY) || "0") || 0;
      bestText.textContent = bestMeters.toFixed(1) + "m";

      let w = 360;
      let h = 640;
      let dpr = 1;

      function resizeCanvas() {
        const rect = app.getBoundingClientRect();
        w = Math.max(280, rect.width);
        h = Math.max(420, rect.height);
        dpr = Math.min(window.devicePixelRatio || 1, 2);
        canvas.width = Math.floor(w * dpr);
        canvas.height = Math.floor(h * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      }
      resizeCanvas();
      window.addEventListener("resize", resizeCanvas);

      let mode = "home"; // "home" | "playing" | "gameover"
      let meters = 0;
      let durability = 100;
      let starTime = 0;
      let rainbowHue = 0;

      const holderY = 128;
      const paperWidth = 74;
      let tipX = w * 0.5;
      let targetX = w * 0.5;
      let prevTipX = w * 0.5;
      const tipY = () => Math.min(h * 0.78, h - 96);

      // 障害物・スター・吹き飛びエフェクト
      let objects = [];
      let blasts = [];
      let spawnTimer = 0.8;
      let lastTime = performance.now();

      function updateHud() {
        lenText.textContent = meters.toFixed(1) + "m";
        if (meters > bestMeters) {
          bestMeters = meters;
          localStorage.setItem(BEST_KEY, bestMeters.toFixed(1));
        }
        bestText.textContent = bestMeters.toFixed(1) + "m";

        const d = Math.max(0, Math.min(100, durability));
        durText.textContent = starTime > 0 ? `無敵 ${starTime.toFixed(1)}s` : Math.round(d) + "%";
        durBar.style.width = starTime > 0 ? "100%" : d + "%";

        if (starTime > 0) {
          durBar.style.background = `hsl(${rainbowHue}, 95%, 55%)`;
        } else if (d > 60) {
          durBar.style.background = "#2563eb";
        } else if (d > 30) {
          durBar.style.background = "#d97706";
        } else {
          durBar.style.background = "#dc2626";
        }
      }

      function resetGame() {
        meters = 0;
        durability = 100;
        starTime = 0;
        tipX = w * 0.5;
        targetX = w * 0.5;
        prevTipX = w * 0.5;
        objects = [];
        blasts = [];
        spawnTimer = 0.7;
        updateHud();
      }

      function startGame() {
        resizeCanvas();
        resetGame();
        mode = "playing";
        startOverlay.classList.add("hidden");
        endOverlay.classList.add("hidden");
      }

      function endGame(reason) {
        if (mode !== "playing") return;
        mode = "gameover";
        updateHud();
        endTitle.textContent = reason || "紙がちぎれた！";
        endLen.textContent = "のばした長さ：" + meters.toFixed(1) + "m";
        endBest.textContent = "1位記録：" + bestMeters.toFixed(1) + "m";
        endOverlay.classList.remove("hidden");
      }

      startBtn.addEventListener("click", startGame);
      retryBtn.addEventListener("click", startGame);

      let dragging = false;
      function updateTarget(clientX) {
        const rect = canvas.getBoundingClientRect();
        const x = clientX - rect.left;
        const margin = paperWidth * 0.5 + 16;
        targetX = Math.max(margin, Math.min(w - margin, x));
      }

      canvas.addEventListener("pointerdown", (e) => {
        if (mode !== "playing") return;
        dragging = true;
        updateTarget(e.clientX);
      });
      window.addEventListener("pointermove", (e) => {
        if (!dragging || mode !== "playing") return;
        updateTarget(e.clientX);
      });
      window.addEventListener("pointerup", () => {
        dragging = false;
      });

      const keys = { left: false, right: false };
      window.addEventListener("keydown", (e) => {
        if (e.key === "ArrowLeft" || e.key === "a" || e.key === "A") keys.left = true;
        if (e.key === "ArrowRight" || e.key === "d" || e.key === "D") keys.right = true;
      });
      window.addEventListener("keyup", (e) => {
        if (e.key === "ArrowLeft" || e.key === "a" || e.key === "A") keys.left = false;
        if (e.key === "ArrowRight" || e.key === "d" || e.key === "D") keys.right = false;
      });

      function spawnObject() {
        const margin = 42;
        const x = margin + Math.random() * Math.max(40, w - margin * 2);
        const r = Math.random();
        if (r < 0.16) {
          objects.push({ kind: "star", x, y: holderY + 16, vx: 0, radius: 18 });
        } else if (r < 0.58) {
          // 猫の手（左右にゆらゆら動く）
          const dir = Math.random() < 0.5 ? -1 : 1;
          objects.push({
            kind: "cat",
            x,
            y: holderY + 16,
            vx: dir * (55 + Math.random() * 45),
            radius: 20
          });
        } else {
          // 水の障害物
          objects.push({
            kind: "water",
            x,
            y: holderY + 16,
            vx: 0,
            radius: 20
          });
        }
      }

      function spawnBlast(x, y, emoji) {
        const angle = (Math.random() - 0.5) * Math.PI * 1.1 - Math.PI * 0.5;
        const spd = 260 + Math.random() * 140;
        blasts.push({
          x,
          y,
          vx: Math.cos(angle) * spd,
          vy: Math.sin(angle) * spd,
          rot: 0,
          vRot: (Math.random() - 0.5) * 14,
          emoji,
          life: 0.75
        });
      }

      function drawBackground() {
        ctx.fillStyle = "#f8fafc";
        ctx.fillRect(0, 0, w, h);

        const grid = 26;
        const offset = (meters * 55) % grid;
        ctx.strokeStyle = "#e2e8f0";
        ctx.lineWidth = 1;
        for (let x = 0; x <= w; x += grid) {
          ctx.beginPath();
          ctx.moveTo(x, 0);
          ctx.lineTo(x, h);
          ctx.stroke();
        }
        for (let y = offset; y <= h; y += grid) {
          ctx.beginPath();
          ctx.moveTo(0, y);
          ctx.lineTo(w, y);
          ctx.stroke();
        }
      }

      function drawPaper() {
        const startY = holderY;
        const endY = tipY();
        const halfW = paperWidth * 0.5;
        const originX = w * 0.5;

        const steps = 28;
        ctx.beginPath();
        for (let i = 0; i <= steps; i++) {
          const t = i / steps;
          const y = startY + (endY - startY) * t;
          const ease = t * t * (3 - 2 * t);
          const cx = originX * (1 - ease) + tipX * ease;
          const lx = cx - halfW;
          if (i === 0) ctx.moveTo(lx, y);
          else ctx.lineTo(lx, y);
        }
        for (let i = steps; i >= 0; i--) {
          const t = i / steps;
          const y = startY + (endY - startY) * t;
          const ease = t * t * (3 - 2 * t);
          const cx = originX * (1 - ease) + tipX * ease;
          const rx = cx + halfW;
          ctx.lineTo(rx, y);
        }
        ctx.closePath();

        if (starTime > 0) {
          ctx.fillStyle = `hsla(${rainbowHue}, 95%, 74%, 0.92)`;
        } else if (durability < 30) {
          ctx.fillStyle = "#fff1f2";
        } else {
          ctx.fillStyle = "#ffffff";
        }
        ctx.fill();

        ctx.strokeStyle = starTime > 0 ? `hsl(${rainbowHue}, 90%, 45%)` : "#94a3b8";
        ctx.lineWidth = 2;
        ctx.stroke();

        ctx.save();
        ctx.setLineDash([5, 5]);
        ctx.strokeStyle = "#cbd5e1";
        ctx.lineWidth = 1.5;
        const perfGap = 44;
        const perfShift = (meters * 55) % perfGap;
        for (let y = startY + perfShift; y < endY; y += perfGap) {
          const t = (y - startY) / Math.max(1, endY - startY);
          const ease = t * t * (3 - 2 * t);
          const cx = originX * (1 - ease) + tipX * ease;
          ctx.beginPath();
          ctx.moveTo(cx - halfW + 6, y);
          ctx.lineTo(cx + halfW - 6, y);
          ctx.stroke();
        }
        ctx.restore();

        ctx.fillStyle = "#e2e8f0";
        ctx.fillRect(originX - halfW - 6, startY - 14, paperWidth + 12, 16);
        ctx.strokeStyle = "#64748b";
        ctx.lineWidth = 2;
        ctx.strokeRect(originX - halfW - 6, startY - 14, paperWidth + 12, 16);

        ctx.beginPath();
        ctx.moveTo(tipX - halfW, endY);
        ctx.lineTo(tipX + halfW, endY);
        ctx.strokeStyle = starTime > 0 ? `hsl(${rainbowHue}, 90%, 40%)` : "#475569";
        ctx.lineWidth = 3;
        ctx.stroke();
      }

      function drawObjectsAndBlasts() {
        for (const obj of objects) {
          ctx.save();
          ctx.font = "28px sans-serif";
          ctx.textAlign = "center";
          ctx.textBaseline = "middle";
          const icon = obj.kind === "cat" ? "🐾" : obj.kind === "water" ? "💧" : "⭐";
          ctx.fillText(icon, obj.x, obj.y);
          ctx.restore();
        }

        for (const b of blasts) {
          ctx.save();
          ctx.globalAlpha = Math.max(0, b.life / 0.75);
          ctx.translate(b.x, b.y);
          ctx.rotate(b.rot);
          ctx.font = "28px sans-serif";
          ctx.textAlign = "center";
          ctx.textBaseline = "middle";
          ctx.fillText(b.emoji, 0, 0);
          ctx.restore();
        }
      }

      function loop(now) {
        const dt = Math.min(0.05, (now - lastTime) / 1000);
        lastTime = now;
        rainbowHue = (rainbowHue + dt * 320) % 360;

        if (mode === "playing") {
          if (keys.left) targetX -= 280 * dt;
          if (keys.right) targetX += 280 * dt;

          const margin = paperWidth * 0.5 + 16;
          targetX = Math.max(margin, Math.min(w - margin, targetX));

          prevTipX = tipX;
          tipX += (targetX - tipX) * Math.min(1, dt * 15);

          const lateralSpeed = Math.abs(tipX - prevTipX) / Math.max(dt, 0.001);
          const fallSpeed = Math.min(360, 165 + meters * 1.8);

          if (starTime > 0) {
            starTime = Math.max(0, starTime - dt);
            meters += ((fallSpeed * 1.2) * dt) / 60;
          } else {
            const safeSpeed = 350;
            if (lateralSpeed > safeSpeed) {
              durability -= (lateralSpeed - safeSpeed) * 0.055 * dt;
            } else {
              durability = Math.min(100, durability + 2.5 * dt);
            }
            meters += (fallSpeed * dt) / 60;
          }

          spawnTimer -= dt;
          if (spawnTimer <= 0) {
            spawnObject();
            spawnTimer = Math.max(0.55, 1.15 - meters * 0.006);
