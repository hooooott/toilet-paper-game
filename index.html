        * {

            user-select: none;

        html, body {
            margin: 0;

            width: 100%;

            touch-action: none;
            font-family: 'M PLUS Rounded 1c', sans-serif;

            touch-action: none;
            display: block;
            width: 100%;
            height: 100%;

            background-color: #f0f9ff;

        }
        .btn-pop {
            transition: transform 0.1s ease, box-shadow 0.1s ease;
            box-shadow: 0 5px 0 #0284c7;
        }
        .btn-pop:active {
            transform: translateY(4px);
            box-shadow: 0 1px 0 #0284c7;
        }
        .btn-pop-green {
            transition: transform 0.1s ease, box-shadow 0.1s ease;
            box-shadow: 0 5px 0 #15803d;
        }
        .btn-pop-green:active {
            transform: translateY(4px);
            box-shadow: 0 1px 0 #15803d;
        }
        @keyframes pulse-fast {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.04); }
        }
        .danger-pulse {
            animation: pulse-fast 0.35s infinite;
        }
        @keyframes banner-pop {
            0% { transform: scale(0.82); opacity: 0; }
            70% { transform: scale(1.05); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }
        .record-banner-anim {
            animation: banner-pop 0.4s cubic-bezier(0.22, 1, 0.36, 1) forwards;

        @keyframes rainbow-glow {
            0% { border-color: #f43f5e; box-shadow: 0 0 12px rgba(244, 63, 94, 0.5); }
            50% { border-color: #10b981; box-shadow: 0 0 12px rgba(16, 185, 129, 0.5); }

        .star-hud-glow {
            animation: rainbow-glow 0.5s linear infinite;

    <script>
        class RetroSoundFX {
            constructor() {
                this.ctx = null;
                this.muted = false;
                this.lastRollTick = 0;
                this.lastBossRoar = 0;
                this.bgmMode = 'NONE';
                this.bgmTimer = null;
                this.bgmStep = 0;
            }

            init() {
                try {
                    if (!this.ctx) {
                        const AudioCtx = window.AudioContext || window.webkitAudioContext;
                        if (AudioCtx) this.ctx = new AudioCtx();
                    }
                    if (this.ctx && this.ctx.state === 'suspended') {
                        this.ctx.resume();
                    }
                } catch (err) {}
            }

            toggleMute() {
                this.muted = !this.muted;
                if (this.muted) {
                    this.stopBgmTimerOnly();
                } else if (this.bgmMode === 'STAR') {
                    this.startStarBgm();
                } else if (this.bgmMode === 'BOSS') {
                    this.startBossBgm();
                } else if (this.bgmMode === 'NORMAL') {
                    this.startNormalBgm();
                }
                return this.muted;
            }

            stopBgmTimerOnly() {
                if (this.bgmTimer) {
                    clearTimeout(this.bgmTimer);
                    this.bgmTimer = null;
                }
            }

            stopBgm() {
                this.bgmMode = 'NONE';
                this.stopBgmTimerOnly();
            }

            playTone(freq, type, dur, vol, delay = 0) {
                if (this.muted || !this.ctx || freq <= 0) return;
                try {
                    const start = this.ctx.currentTime + delay;
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = type;
                    osc.frequency.setValueAtTime(freq, start);
                    gain.gain.setValueAtTime(0.001, start);
                    gain.gain.linearRampToValueAtTime(vol, start + 0.01);
                    gain.gain.exponentialRampToValueAtTime(0.001, start + dur);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start(start);
                    osc.stop(start + dur + 0.01);
                } catch (err) {}
            }

            startNormalBgm() {
                this.init();
                this.bgmMode = 'NORMAL';
                this.stopBgmTimerOnly();
                this.bgmStep = 0;
                const lead = [
                    523.25, 0, 659.25, 783.99, 880.00, 783.99, 659.25, 587.33,
                    523.25, 523.25, 659.25, 587.33, 493.88, 0, 392.00, 0
                ];
                const bass = [
                    130.81, 196.00, 130.81, 196.00, 146.83, 220.00, 146.83, 220.00,
                    130.81, 196.00, 174.61, 196.00, 123.47, 196.00, 130.81, 0
                ];
                const tick = () => {
                    if (this.muted || this.bgmMode !== 'NORMAL') return;
                    const i = this.bgmStep % lead.length;
                    const stepSec = 0.16;
                    this.playTone(lead[i], 'square', stepSec * 0.8, 0.032);
                    this.playTone(bass[i], 'triangle', stepSec * 0.9, 0.065);
                    this.bgmStep++;
                    this.bgmTimer = setTimeout(tick, stepSec * 1000);
                };
                tick();
            }

            startStarBgm() {
                this.init();
                this.bgmMode = 'STAR';
                this.stopBgmTimerOnly();
                let sStep = 0;
                const starNotes = [
                    1046.50, 1046.50, 1046.50, 880.00, 1046.50, 0, 1046.50, 880.00,
                    987.77, 987.77, 987.77, 783.99, 987.77, 0, 987.77, 783.99
                ];
                const starBass = [
                    261.63, 392.00, 261.63, 392.00, 261.63, 392.00, 261.63, 392.00,
                    246.94, 392.00, 246.94, 392.00, 246.94, 392.00, 246.94, 392.00
                ];
                const tick = () => {
                    if (this.muted || this.bgmMode !== 'STAR') return;
                    const i = sStep % starNotes.length;
                    const stepSec = 0.105;
                    this.playTone(starNotes[i], 'square', stepSec * 0.8, 0.038);
                    this.playTone(starBass[i], 'triangle', stepSec * 0.85, 0.065);
                    sStep++;
                    this.bgmTimer = setTimeout(tick, stepSec * 1000);
                };
                tick();
            }

            startBossBgm() {
                this.init();
                this.bgmMode = 'BOSS';
                this.stopBgmTimerOnly();
                let bStep = 0;
                const bossLead = [
                    329.63, 329.63, 392.00, 329.63, 440.00, 392.00, 349.23, 329.63,
                    293.66, 293.66, 349.23, 293.66, 392.00, 349.23, 329.63, 246.94
                ];
                const bossBass = [
                    82.41, 164.81, 82.41, 164.81, 87.31, 174.61, 87.31, 174.61,
                    73.42, 146.83, 73.42, 146.83, 98.00, 196.00, 82.41, 123.47
                ];
                const tick = () => {
                    if (this.muted || this.bgmMode !== 'BOSS') return;
                    const i = bStep % bossLead.length;
                    const stepSec = 0.135;
                    this.playTone(bossLead[i], 'sawtooth', stepSec * 0.75, 0.03);
                    this.playTone(bossBass[i], 'square', stepSec * 0.85, 0.055);
                    bStep++;
                    this.bgmTimer = setTimeout(tick, stepSec * 1000);
                };
                tick();
            }

            playStarGet() {
                [523.25, 659.25, 783.99, 1046.50, 1318.51, 1567.98].forEach((f, idx) => {
                    this.playTone(f, 'square', 0.09, 0.06, idx * 0.045);
                });
            }

            playSmash() {
                this.playTone(220, 'square', 0.06, 0.07, 0);
                this.playTone(660, 'square', 0.1, 0.07, 0.05);
            }

            playBossAlert() {
                [220, 185, 220, 146.83].forEach((f, idx) => {
                    this.playTone(f, 'sawtooth', 0.14, 0.08, idx * 0.13);
                });
            }

            playBossRoar() {
                if (this.muted || !this.ctx) return;
                const now = performance.now();
                if (now - this.lastBossRoar < 900) return;
                this.lastBossRoar = now;
                this.playTone(110, 'sawtooth', 0.16, 0.05, 0);
            }

            playRollTick(speedRatio) {
                if (this.muted || !this.ctx) return;
                const now = this.ctx.currentTime;
                const interval = Math.max(0.065, 0.14 - speedRatio * 0.05);
                if (now - this.lastRollTick < interval) return;
                this.lastRollTick = now;
                this.playTone(190 + Math.random() * 45, 'triangle', 0.03, 0.02);
            }

            playItem(isGold = false) {
                const freqs = isGold ? [587.33, 880, 1174.66] : [523.25, 783.99];
                freqs.forEach((f, idx) => {
                    this.playTone(f, 'square', 0.12, 0.055, idx * 0.055);
                });
            }

            playWarning() {
                this.playTone(460, 'sawtooth', 0.08, 0.035, 0);
            }

            playTear() {
                if (this.muted || !this.ctx) return;
                try {
                    const now = this.ctx.currentTime;
                    const bufferSize = Math.floor(this.ctx.sampleRate * 0.35);
                    const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
                    const data = buffer.getChannelData(0);
                    for (let i = 0; i < bufferSize; i++) {
                        data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (bufferSize * 0.35));
                    }
                    const noise = this.ctx.createBufferSource();
                    noise.buffer = buffer;

                    const filter = this.ctx.createBiquadFilter();
                    filter.type = 'bandpass';
                    filter.frequency.setValueAtTime(1400, now);
                    filter.frequency.exponentialRampToValueAtTime(300, now + 0.35);

                    const gain = this.ctx.createGain();
                    gain.gain.setValueAtTime(0.3, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.35);

                    noise.connect(filter);
                    filter.connect(gain);
                    gain.connect(this.ctx.destination);
                    noise.start(now);
                } catch (err) {}
            }

            playFanfare(isFirstPlace = true) {
                const notes = isFirstPlace
                    ? [
                        { freq: 523.25, time: 0.0, dur: 0.12 },
                        { freq: 659.25, time: 0.11, dur: 0.12 },
                        { freq: 783.99, time: 0.22, dur: 0.12 },
                        { freq: 1046.50, time: 0.34, dur: 0.38 },
                        { freq: 880.00, time: 0.56, dur: 0.12 },
                        { freq: 1046.50, time: 0.70, dur: 0.45 }
                    ]
                    : [
                        { freq: 523.25, time: 0.0, dur: 0.12 },
                        { freq: 659.25, time: 0.12, dur: 0.12 },
                        { freq: 783.99, time: 0.24, dur: 0.28 }
                    ];
                notes.forEach(n => {
                    this.playTone(n.freq, 'square', n.dur, 0.06, 0.18 + n.time);
                });
            }
        }

        const sound = new RetroSoundFX();
        const RANKING_STORAGE_KEY = 'tp_longrun_ranking_top5_v1';
        const LEGACY_BEST_KEY = 'tp_longrun_best_v1';

        function formatNowDateTime() {
            const d = new Date();
            const month = String(d.getMonth() + 1).padStart(2, '0');
            const day = String(d.getDate()).padStart(2, '0');
            const hours = String(d.getHours()).padStart(2, '0');
            const minutes = String(d.getMinutes()).padStart(2, '0');
            return `${month}/${day} ${hours}:${minutes}`;
        }

        function loadRanking() {
            try {
                const raw = localStorage.getItem(RANKING_STORAGE_KEY);
                if (raw) {
                    const parsed = JSON.parse(raw);
                    if (Array.isArray(parsed)) {
                        return parsed
                            .filter(item => typeof item.distance === 'number' && !Number.isNaN(item.distance))
                            .map(item => ({
                                distance: Math.round(item.distance * 10) / 10,
                                dateStr: item.dateStr || '--/-- --:--',
                                id: item.id || String(Math.random())
                            }))
                            .sort((a, b) => b.distance - a.distance)
                            .slice(0, 5);
                    }
                }
                const legacy = parseFloat(localStorage.getItem(LEGACY_BEST_KEY) || '0');
                if (legacy > 0) {
                    const initial = [{
                        distance: Math.round(legacy * 10) / 10,
                        dateStr: formatNowDateTime(),
                        id: 'legacy-best'
                    }];
                    saveRanking(initial);
                    return initial;
                }
            } catch (err) {}
            return [];
        }

        function saveRanking(list) {
            try {
                localStorage.setItem(RANKING_STORAGE_KEY, JSON.stringify(list.slice(0, 5)));
            } catch (err) {}
        }

        function clearRanking() {
            rankingList = [];
            try {
                localStorage.removeItem(RANKING_STORAGE_KEY);
                localStorage.removeItem(LEGACY_BEST_KEY);
            } catch (err) {}
            renderRankingBoards();

        function recordScoreToRanking(rawDistance) {
            const rounded = Math.round(rawDistance * 10) / 10;
            if (rounded <= 0) return { rank: null, isFirstPlace: false };
            const prevTopScore = rankingList.length > 0 ? rankingList[0].distance : 0;
            const entryId = `${Date.now()}-${Math.random().toString(36).slice(2, 6)}`;
            const newEntry = {
                distance: rounded,
                dateStr: formatNowDateTime(),
                id: entryId
            };
            const combined = [...rankingList, newEntry]
                .sort((a, b) => b.distance - a.distance)
                .slice(0, 5);
            const foundIndex = combined.findIndex(item => item.id === entryId);
            const rank = foundIndex !== -1 ? foundIndex + 1 : null;
            const isFirstPlace = rank === 1 && rounded > prevTopScore;
            rankingList = combined;
            saveRanking(rankingList);
            renderRankingBoards();
            updateBestScoreUI();
            return { rank, isFirstPlace };
        }

        function spawnEntity() {

                    phase: Math.random() * Math.PI * 2,
                    radius: 22
                });
            } else if (rand < 0.78) {
                const blowRight = spawnX < width / 2;
                entities.push({
                    type: 'fan',
                    x: blowRight ? 34 : width - 34,
                    y: spawnY,
                    blowRight,
                    radius: 26,
                    bladeAngle: 0
                });
            } else

        function update(dt) {
            rainbowHue = (rainbowHue + 420 * dt) % 360;

            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.vx * dt;
                p.y += p.vy * dt;
                if (!p.isStar) p.vy += 420 * dt;
                p.rot += p.vRot * dt;
                p.life -= dt;
                if (p.life <= 0) particles.splice(i, 1);
            }

            for (let i = floatingTexts.length - 1; i >= 0; i--) {
                const ft = floatingTexts[i];
                ft.y -= 45 * dt;
                ft.life -= dt;
                if (ft.life <= 0) floatingTexts.splice(i, 1);
            }

            if (gameState !== 'PLAYING') {
                if (gameState === 'START') rollAngle += 1.2 * dt;
                return;
            }

            const isStar = starTimer > 0;
            if (isStar) {
                starTimer -= dt;
                if (Math.random() < 0.6) {
                    particles.push({
                        x: paper.x + (Math.random() - 0.5) * 32,
                        y: paper.y - Math.random() * 40,
                        vx: (Math.random() - 0.5) * 70,
                        vy: -40 - Math.random() * 60,
                        size: 5 + Math.random() * 4,
                        rot: Math.random() * Math.PI,
                        vRot: 6,
                        color: `hsl(${(rainbowHue + Math.random() * 120) % 360}, 95%, 60%)`,
                        life: 0.45,
                        isStar: true
                    });
                }
                if (starTimer <= 0) {
                    starTimer = 0;
                    if (bossActive) sound.startBossBgm();
                    else sound.startNormalBgm();
                    addFloatingText(paper.x, paper.y - 15, '無敵タイム終了', '#64748b');
                }
            }

            const currentScore = getCurrentScore();
            if (currentScore >= BOSS_SCORE_THRESHOLD && !bossActive) {
                bossActive = true;
                if (!bossAlertShown) {
                    bossAlertShown = true;
                    sound.playBossAlert();
                    addFloatingText(width / 2, height * 0.35, '⚠️ 1,000点突破！ボス襲来！', '#dc2626');
                }
                if (!isStar) sound.startBossBgm();
            }

            const baseSpeed = Math.min(580, 235 + distance * 2.2);
            speed = isStar ? baseSpeed * 1.25 : baseSpeed;
            distance += (speed / 42) * dt;
            rollAngle += (speed / 28) * dt;
            rollRadius = Math.max(18, 38 - distance * 0.08);

            sound.playRollTick((baseSpeed - 235) / 345);

            const keySpeed = 430;
            if (input.leftPressed) paper.targetX -= keySpeed * dt;
            if (input.rightPressed) paper.targetX += keySpeed * dt;

            const sideMargin = 28;
            paper.targetX = Math.max(sideMargin, Math.min(width - sideMargin, paper.targetX));

            const prevX = paper.x;
            const lerpFactor = 1 - Math.exp(-16 * dt);
            paper.x += (paper.targetX - paper.x) * lerpFactor;
            paper.vx = (paper.x - prevX) / Math.max(dt, 0.001);

            if (!isStar) {
                const absVx = Math.abs(paper.vx);
                const stretchRatio = Math.abs(paper.x - width / 2) / (width * 0.5);
                const safeSpeedThreshold = bossActive ? 295 : 335;

                if (absVx > safeSpeedThreshold) {
                    const excess = (absVx - safeSpeedThreshold) / 420;
                    durability -= (34 + excess * 72) * dt;
                } else {
                    const recoverRate = stretchRatio > 0.75 ? 4.5 : 10.5;
                    durability = Math.min(100, durability + recoverRate * dt);
                }

                if (durability < 30 && performance.now() - lastWarningTime > 450) {
                    sound.playWarning();
                    lastWarningTime = performance.now();
                }

                if (durability <= 0) {
                    durability = 0;
                    updateHUD();
                    triggerGameOver('ビリッ！急操作で紙がちぎれた！', paper.x, paper.y - 30);
                    return;
                }
            }

            if (bossActive) {
                boss.phase += 3.2 * dt;
                boss.bladeAngle += 16 * dt;
                const desiredBossX = paper.x + Math.sin(boss.phase * 0.8) * 75;
                const diffX = desiredBossX - boss.x;
                boss.x += Math.sign(diffX) * Math.min(Math.abs(diffX), 210 * dt);
                boss.x = Math.max(54, Math.min(width - 54, boss.x));
                boss.y = height * 0.74 + Math.sin(boss.phase * 1.6) * 28;

                const distToBoss = Math.hypot(paper.x - boss.x, paper.y - boss.y);
                if (distToBoss < 120) {
                    sound.playBossRoar();
                    if (!isStar) {
                        const pullDir = paper.x < boss.x ? 1 : -1;
                        paper.targetX += pullDir * 120 * dt;
                        durability -= 11 * dt;
                        if (durability <= 0) {
                            durability = 0;
                            updateHUD();
                            triggerGameOver('ガシャーン！ボスに引きちぎられた！', paper.x, paper.y);
                            return;
                        }
                    }
                }

                if (distToBoss < boss.radius + paper.width * 0.35) {
                    if (isStar) {
                        distance += 2.0;
                        sound.playSmash();
                        addFloatingText(boss.x, boss.y - 20, '🌟 ボス撃退 +2.0m!', '#f43f5e');
                        boss.x = boss.x < width / 2 ? width - 64 : 64;
                        for (let k = 0; k < 14; k++) {
                            particles.push({
                                x: boss.x,
                                y: boss.y,
                                vx: (Math.random() - 0.5) * 300,
                                vy: -80 - Math.random() * 180,
                                size: 7 + Math.random() * 5,
                                rot: Math.random() * 6,
                                vRot: 9,
                                color: `hsl(${(rainbowHue + k * 25) % 360}, 95%, 60%)`,
                                life: 0.7,
                                isStar: true
                            });
                        }
                    } else {
                        triggerGameOver('ガシャーン！ボスに捕まってちぎれた！', boss.x, boss.y);
                        return;
                    }
                }
            }

            const rollBottomY = getRollY() + rollRadius * 0.55;
            const steps = paper.trail.length - 1;
            for (let i = 0; i <= steps; i++) {
                const t = i / steps;
                const targetY = rollBottomY + (paper.y - rollBottomY) * t;
                const ease = t * t * (3 - 2 * t);
                const wave = Math.sin(distance * 3 - t * 5) * (2.5 * t);
                const desiredX = (width / 2) + (paper.x - width / 2) * ease + wave;

                paper.trail[i].y = targetY;
                paper.trail[i].x += (desiredX - paper.trail[i].x) * Math.min(1, dt * (12 + t * 14));
            }

            spawnTimer -= dt;
            if (spawnTimer <= 0) {
                spawnEntity();
                const baseInterval = bossActive ? 0.42 : 0.52;
                const interval = Math.max(baseInterval, 1.15 - distance * 0.0045);
                spawnTimer = interval * (0.78 + Math.random() * 0.42);
            }

            for (let i = entities.length - 1; i >= 0; i--) {
                const e = entities[i];
                e.y -= speed * dt;

                if (e.type === 'puddle') {
                    e.wobble += 4 * dt;
                } else if (e.type === 'scissors') {
                    e.snipPhase += 12 * dt;
                    e.x += e.vx * dt;
                    if (e.x < 35 || e.x > width - 35) e.vx *= -1;
                } else if (e.type === 'catpaw') {
                    e.phase += 4.5 * dt;
                    const extend = (Math.sin(e.phase) * 0.5 + 0.5) * e.reach;
                    e.x = e.fromLeft ? (-15 + extend) : (width + 15 - extend);
                } else if (e.type === 'fan') {
                    e.bladeAngle += 18 * dt;
                    if (!isStar && Math.abs(e.y - paper.y) < 48) {
                        const windForce = e.blowRight ? 190 : -190;
                        paper.targetX += windForce * dt;
                        durability -= 14 * dt;
                    }
                } else if (e.type === 'repair' || e.type === 'gold') {
                    e.bob += 5 * dt;
                } else if (e.type === 'star') {
                    e.bob += 6 * dt;
                    e.spin += 4 * dt;
                }

                const hitCheckPoints = [
                    { x: paper.x, y: paper.y },
                    paper.trail[Math.floor(paper.trail.length * 0.78)]
                ];

                let hit = false;
                for (const pt of hitCheckPoints) {
                    if (!pt) continue;
                    const dist = Math.hypot(pt.x - e.x, pt.y - e.y);
                    if (dist < e.radius + (paper.width * 0.36)) {
                        hit = true;
                        break;
                    }
                }

                if (hit) {
                    if (e.type === 'star') {
                        activateStarMode();
                        entities.splice(i, 1);
                        continue;
                    }
                    if (e.type === 'repair') {
                        durability = Math.min(100, durability + 35);
                        sound.playItem(false);
                        addFloatingText(e.x, e.y - 10, '耐久 +35%!', '#10b981');
                        entities.splice(i, 1);
                        continue;
                    }
                    if (e.type === 'gold') {
                        distance += 5.0;
                        durability = Math.min(100, durability + 20);
                        sound.playItem(true);
                        addFloatingText(e.x, e.y - 10, '+5.0m ボーナス!', '#f59e0b');
                        entities.splice(i, 1);
                        continue;
                    }

                    if (isStar && (e.type === 'puddle' || e.type === 'scissors' || e.type === 'catpaw' || e.type === 'fan')) {
                        distance += 1.0;
                        sound.playSmash();
                        addFloatingText(e.x, e.y - 10, '💥 撃破 +1.0m!', '#ec4899');
                        for (let k = 0; k < 10; k++) {
                            particles.push({
                                x: e.x,
                                y: e.y,
                                vx: (Math.random() - 0.5) * 280,
                                vy: -80 - Math.random() * 180,
                                size: 6 + Math.random() * 5,
                                rot: Math.random() * 6,
                                vRot: 9,
                                color: `hsl(${(rainbowHue + k * 36) % 360}, 90%, 60%)`,
                                life: 0.65,
                                isStar: true
                            });
                        }
                        entities.splice(i, 1);
                        continue;
                    }

                    if (e.type === 'puddle') {
                        triggerGameOver('ビチャッ！水たまりでふやけた！', e.x, e.y);
                        return;
                    }
                    if (e.type === 'scissors') {
                        triggerGameOver('チョキン！ハサミで切られた！', e.x, e.y);
                        return;
                    }
                    if (e.type === 'catpaw') {
                        triggerGameOver('ニャー！猫に引きちぎられた！', e.x, e.y);
                        return;
                    }
                }

                if (e.y < -80) {
                    entities.splice(i, 1);
                }
            }

            updateHUD();
        }

        function updateHUD() {
            distanceDisplay.textContent = distance.toFixed(1);
            scoreDisplay.textContent = String(getCurrentScore());

            tensionContainer.classList.remove('border-rose-400', 'danger-pulse', 'border-sky-200', 'star-hud-glow');

            if (starTimer > 0) {
                const starPct = Math.max(0, Math.min(100, Math.round((starTimer / STAR_DURATION) * 100)));
                tensionLabel.textContent = `🌟 無敵レインボー中（残り ${starTimer.toFixed(1)}秒）`;
                tensionPercent.textContent = '無敵!';
                tensionPercent.className = 'text-amber-500 font-black';
                tensionBar.style.width = `${starPct}%`;
                tensionBar.className = 'h-full bg-gradient-to-r from-rose-500 via-amber-400 to-sky-400 rounded-full transition-all duration-75';
                tensionContainer.classList.add('star-hud-glow');
                return;
            }

            tensionLabel.textContent = bossActive
                ? '👾 ボス出現中！急操作＆接近に注意！'
                : '🧻 紙の耐久度（ちぎれ注意・急操作NG！）';

            const pct = Math.max(0, Math.min(100, Math.round(durability)));
            tensionPercent.textContent = `${pct}%`;
            tensionBar.style.width = `${pct}%`;

            if (pct <= 30) {
                tensionBar.className = 'h-full bg-gradient-to-r from-rose-500 to-red-600 rounded-full transition-all duration-75';
                tensionPercent.className = 'text-rose-600 font-extrabold';
                tensionContainer.classList.add('border-rose-400', 'danger-pulse');
            } else if (pct <= 60) {
                tensionBar.className = 'h-full bg-gradient-to-r from-amber-400 to-orange-400 rounded-full transition-all duration-75';
                tensionPercent.className = 'text-amber-600 font-extrabold';
                tensionContainer.classList.add('border-sky-200');
            } else {
                tensionBar.className = 'h-full bg-gradient-to-r from-emerald-400 to-sky-400 rounded-full transition-all duration-75';
                tensionPercent.className = 'text-sky-600 font-extrabold';
                tensionContainer.classList.add('border-sky-200');
            }
        }

        function draw() {
            ctx.clearRect(0, 0, width, height);
            drawScrollingGuides();
            entities.forEach(e => drawEntity(e));

            if (gameState !== 'GAMEOVER') {
                drawPaperRibbon();
            } else if (tearPoint) {
                drawTornPaper();
            }

            if (bossActive && gameState === 'PLAYING') {
                drawBoss();
            }

            drawPaperRoll();

            particles.forEach(p => {
                ctx.save();
                ctx.translate(p.x, p.y);
                ctx.rotate(p.rot);
                ctx.fillStyle = p.color;
                if (p.isStar) {
                    drawStarShape(ctx, 0, 0, 5, p.size, p.size * 0.45);
                    ctx.fill();
                } else {
                    ctx.strokeStyle = '#cbd5e1';
                    ctx.lineWidth = 1;
                    ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * 0.7);
                    ctx.strokeRect(-p.size / 2, -p.size / 2, p.size, p.size * 0.7);
                }
                ctx.restore();
            });

            floatingTexts.forEach(ft => {
                ctx.save();
                ctx.globalAlpha = Math.max(0, ft.life);
                ctx.font = '800 15px "M PLUS Rounded 1c", sans-serif';
                ctx.textAlign = 'center';
                ctx.lineWidth = 4;
                ctx.strokeStyle = '#ffffff';
                ctx.strokeText(ft.text, ft.x, ft.y);
                ctx.fillStyle = ft.color;
                ctx.fillText(ft.text, ft.x, ft.y);
                ctx.restore();
            });
        }

        function drawBoss() {
            ctx.save();
            ctx.translate(boss.x, boss.y);

            ctx.strokeStyle = 'rgba(239, 68, 68, 0.25)';
            ctx.lineWidth = 2;
            ctx.setLineDash([6, 6]);
            ctx.beginPath();
            ctx.arc(0, 0, 86 + Math.sin(boss.phase * 4) * 6, 0, Math.PI * 2);
            ctx.stroke();
            ctx.setLineDash([]);

            ctx.save();
            ctx.rotate(boss.bladeAngle);
            ctx.fillStyle = '#475569';
            for (let i = 0; i < 6; i++) {
                ctx.rotate(Math.PI / 3);
                ctx.beginPath();
                ctx.moveTo(0, -boss.radius - 10);
                ctx.lineTo(10, -boss.radius + 4);
                ctx.lineTo(-10, -boss.radius + 4);
                ctx.closePath();
                ctx.fill();
            }
            ctx.restore();

            ctx.fillStyle = '#7f1d1d';
            ctx.strokeStyle = '#ef4444';
            ctx.lineWidth = 3.5;
            ctx.beginPath();
            ctx.arc(0, 0, boss.radius, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();

            ctx.fillStyle = '#fef08a';
            ctx.beginPath();
            ctx.moveTo(-18, -8);
            ctx.lineTo(-6, -2);
            ctx.lineTo(-18, 4);
            ctx.closePath();
            ctx.fill();

            ctx.beginPath();
            ctx.moveTo(18, -8);
            ctx.lineTo(6, -2);
            ctx.lineTo(18, 4);
            ctx.closePath();
            ctx.fill();

            ctx.strokeStyle = '#fef08a';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.arc(0, 14, 11, Math.PI * 1.15, Math.PI * 1.85);
            ctx.stroke();

            ctx.font = '900 10px "M PLUS Rounded 1c", sans-serif';
            ctx.fillStyle = '#ffffff';
            ctx.textAlign = 'center';
            ctx.fillText('BOSS', 0, -boss.radius - 14);

            ctx.restore();
        }

        function drawStarShape(c, cx, cy, spikes, outerR, innerR) {
            let rot = Math.PI / 2 * 3;
            const step = Math.PI / spikes;
            c.beginPath();
            c.moveTo(cx, cy - outerR);
            for (let i = 0; i < spikes; i++) {
                c.lineTo(cx + Math.cos(rot) * outerR, cy + Math.sin(rot) * outerR);
                rot += step;
                c.lineTo(cx + Math.cos(rot) * innerR, cy + Math.sin(rot) * innerR);
                rot += step;
            }
            c.lineTo(cx, cy - outerR);
            c.closePath();
        }

        function drawScrollingGuides() {
            const isStar = starTimer > 0;
            const offset = (distance * 42) % 90;
            ctx.save();
            ctx.strokeStyle = isStar
                ? `hsla(${rainbowHue}, 85%, 65%, 0.45)`
                : bossActive
                    ? 'rgba(248, 113, 113, 0.32)'
                    : 'rgba(125, 211, 252, 0.35)';
            ctx.lineWidth = 2;
            ctx.setLineDash([8, 12]);
            for (let x = 45; x < width; x += 90) {
                ctx.beginPath();
                ctx.moveTo(x, -offset);
                ctx.lineTo(x, height);
                ctx.stroke();
            }
            ctx.restore();
        }

        function drawPaperRibbon() {
            if (paper.trail.length < 2) return;
            const halfW = paper.width / 2;
            const dangerRatio = Math.max(0, (55 - durability) / 55);
            const isStar = starTimer > 0;

            ctx.save();
            if (isStar) {
                ctx.shadowColor = `hsl(${rainbowHue}, 95%, 55%)`;
                ctx.shadowBlur = 14;
            }

            ctx.beginPath();
            for (let i = 0; i < paper.trail.length; i++) {
                const pt = paper.trail[i];
                if (i === 0) ctx.moveTo(pt.x - halfW + 4, pt.y + 6);
                else ctx.lineTo(pt.x - halfW + 4, pt.y + 6);
            }
            for (let i = paper.trail.length - 1; i >= 0; i--) {
                const pt = paper.trail[i];
                ctx.lineTo(pt.x + halfW + 4, pt.y + 6);
            }
            ctx.closePath();
            ctx.fillStyle = 'rgba(15, 23, 42, 0.08)';
            ctx.fill();

            ctx.beginPath();
            for (let i = 0; i < paper.trail.length; i++) {
                const pt = paper.trail[i];
                if (i === 0) ctx.moveTo(pt.x - halfW, pt.y);
                else ctx.lineTo(pt.x - halfW, pt.y);
            }
            const tip = paper.trail[paper.trail.length - 1];
            const teeth = 5;
            for (let t = 0; t <= teeth; t++) {
                const tx = (tip.x - halfW) + (paper.width * (t / teeth));
                const ty = tip.y + (t % 2 === 0 ? 0 : 4);
                ctx.lineTo(tx, ty);
            }
            for (let i = paper.trail.length - 1; i >= 0; i--) {
                const pt = paper.trail[i];
                ctx.lineTo(pt.x + halfW, pt.y);
            }
            ctx.closePath();

            if (isStar) {
                const topPt = paper.trail[0];
                const rbGrad = ctx.createLinearGradient(0, topPt.y, 0, tip.y);
                for (let s = 0; s <= 5; s++) {
                    rbGrad.addColorStop(s / 5, `hsl(${(rainbowHue + s * 60) % 360}, 95%, 78%)`);
                }
                ctx.fillStyle = rbGrad;
                ctx.fill();
                ctx.lineWidth = 2.5;
                ctx.strokeStyle = `hsl(${(rainbowHue + 180) % 360}, 95%, 50%)`;
                ctx.stroke();
            } else {
                const r = 255;
                const g = Math.round(255 - dangerRatio * 145);
                const b = Math.round(255 - dangerRatio * 145);
                ctx.fillStyle = `rgb(${r}, ${g}, ${b})`;
                ctx.fill();
                ctx.lineWidth = 2;
                ctx.strokeStyle = dangerRatio > 0.4 ? '#f43f5e' : '#cbd5e1';
                ctx.stroke();
            }

            ctx.shadowBlur = 0;
            ctx.strokeStyle = isStar ? 'rgba(255,255,255,0.75)' : (dangerRatio > 0.4 ? 'rgba(244, 63, 94, 0.5)' : 'rgba(148, 163, 184, 0.55)');
            ctx.lineWidth = 1.5;
            ctx.setLineDash([3, 3]);
            const perfOffset = (distance * 42) % 38;
            for (let i = 2; i < paper.trail.length - 1; i += 4) {
                const pt = paper.trail[i];
                ctx.beginPath();
                ctx.moveTo(pt.x - halfW + 2, pt.y + (perfOffset * 0.15));
                ctx.lineTo(pt.x + halfW - 2, pt.y + (perfOffset * 0.15));
                ctx.stroke();
            }
            ctx.setLineDash([]);

            ctx.beginPath();
            ctx.arc(tip.x, tip.y - 6, 7, 0, Math.PI * 2);
            ctx.fillStyle = isStar
                ? `hsla(${rainbowHue}, 95%, 55%, 0.45)`
                : (dangerRatio > 0.4 ? 'rgba(244, 63, 94, 0.25)' : 'rgba(14, 165, 233, 0.22)');
            ctx.fill();

            ctx.restore();
        }

        function drawTornPaper() {
            const halfW = paper.width / 2;
            const topPt = paper.trail[0];
            if (!topPt) return;

            ctx.save();
            ctx.beginPath();
            ctx.moveTo(topPt.x - halfW, topPt.y);
            ctx.lineTo(topPt.x - halfW, topPt.y + 42);
            ctx.lineTo(topPt.x - 6, topPt.y + 34);
            ctx.lineTo(topPt.x + 4, topPt.y + 46);
            ctx.lineTo(topPt.x + halfW, topPt.y + 36);
            ctx.lineTo(topPt.x + halfW, topPt.y);
            ctx.closePath();
            ctx.fillStyle = '#ffffff';
            ctx.fill();
            ctx.strokeStyle = '#cbd5e1';
            ctx.lineWidth = 2;
            ctx.stroke();
            ctx.restore();
        }

        function drawPaperRoll() {
            const cx = width / 2;
            const cy = getRollY();
            const rollWidth = 86;
            const r = rollRadius;
            const isStar = starTimer > 0;

            ctx.save();

            ctx.strokeStyle = '#94a3b8';
            ctx.lineWidth = 6;
            ctx.lineCap = 'round';
            ctx.beginPath();
            ctx.moveTo(cx - rollWidth / 2 - 12, cy - 26);
            ctx.lineTo(cx - rollWidth / 2 - 12, cy);
            ctx.lineTo(cx + rollWidth / 2 + 12, cy);
            ctx.lineTo(cx + rollWidth / 2 + 12, cy - 26);
            ctx.stroke();

            ctx.fillStyle = 'rgba(15, 23, 42, 0.1)';
            ctx.beginPath();
            ctx.roundRect(cx - rollWidth / 2 + 3, cy - r + 5, rollWidth, r * 2, 10);
            ctx.fill();

            const grad = ctx.createLinearGradient(0, cy - r, 0, cy + r);
            if (isStar) {
                grad.addColorStop(0, `hsl(${rainbowHue}, 95%, 75%)`);
                grad.addColorStop(0.5, '#ffffff');
                grad.addColorStop(1, `hsl(${(rainbowHue + 180) % 360}, 95%, 75%)`);
            } else {
                grad.addColorStop(0, '#e2e8f0');
                grad.addColorStop(0.25, '#ffffff');
                grad.addColorStop(0.75, '#f8fafc');
                grad.addColorStop(1, '#cbd5e1');
            }

            ctx.fillStyle = grad;
            ctx.strokeStyle = isStar ? `hsl(${rainbowHue}, 90%, 50%)` : '#94a3b8';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.roundRect(cx - rollWidth / 2, cy - r, rollWidth, r * 2, 8);
            ctx.fill();
            ctx.stroke();

            ctx.save();
            ctx.beginPath();
            ctx.roundRect(cx - rollWidth / 2, cy - r, rollWidth, r * 2, 8);
            ctx.clip();

            ctx.strokeStyle = 'rgba(148, 163, 184, 0.35)';
            ctx.lineWidth = 1.5;
            ctx.setLineDash([4, 4]);
            for (let k = -2; k <= 2; k++) {
                const phase = (rollAngle + k * 0.9) % Math.PI;
                const lineY = cy + Math.cos(phase) * (r * 0.88);
                ctx.beginPath();
                ctx.moveTo(cx - rollWidth / 2, lineY);
                ctx.lineTo(cx + rollWidth / 2, lineY);
                ctx.stroke();
            }
            ctx.restore();

            const sideX = cx + rollWidth / 2;
            ctx.fillStyle = '#f1f5f9';
            ctx.strokeStyle = '#94a3b8';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.ellipse(sideX, cy, 11, r, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();

            ctx.fillStyle = '#b45309';
            ctx.beginPath();
            ctx.ellipse(sideX, cy, 4.5, 11, 0, 0, Math.PI * 2);
            ctx.fill();

            ctx.restore();
        }

        function drawEntity(e) {
            ctx.save();
            ctx.translate(e.x, e.y);

            if (e.type === 'puddle') {
                ctx.scale(1 + Math.sin(e.wobble) * 0.06, 1 + Math.cos(e.wobble) * 0.06);
                ctx.fillStyle = 'rgba(56, 189, 248, 0.78)';
                ctx.strokeStyle = '#0284c7';
                ctx.lineWidth = 2.5;
                ctx.beginPath();
                ctx.arc(0, 0, e.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();

                ctx.fillStyle = 'rgba(255, 255, 255, 0.75)';
                ctx.beginPath();
                ctx.ellipse(-e.radius * 0.3, -e.radius * 0.3, e.radius * 0.28, e.radius * 0.14, -0.5, 0, Math.PI * 2);
                ctx.fill();

                ctx.font = 'bold 11px "M PLUS Rounded 1c", sans-serif';
                ctx.fillStyle = '#0369a1';
                ctx.textAlign = 'center';
                ctx.fillText('みず', 0, 4);

            } else if (e.type === 'scissors') {
                const openAngle = 0.22 + Math.abs(Math.sin(e.snipPhase)) * 0.35;
                ctx.rotate(-Math.PI / 2);

                ctx.save();
                ctx.rotate(openAngle);
                ctx.fillStyle = '#cbd5e1';
                ctx.strokeStyle = '#475569';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(0, -3);
                ctx.lineTo(24, 0);
                ctx.lineTo(0, 4);
                ctx.closePath();
                ctx.fill();
                ctx.stroke();
                ctx.restore();

                ctx.save();
                ctx.rotate(-openAngle);
                ctx.fillStyle = '#94a3b8';
                ctx.strokeStyle = '#475569';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(0, -4);
                ctx.lineTo(24, 0);
                ctx.lineTo(0, 3);
                ctx.closePath();
                ctx.fill();
                ctx.stroke();
                ctx.restore();

                ctx.strokeStyle = '#ef4444';
                ctx.lineWidth = 4;
                ctx.beginPath();
                ctx.arc(-10, -8, 6, 0, Math.PI * 2);
                ctx.stroke();
                ctx.beginPath();
                ctx.arc(-10, 8, 6, 0, Math.PI * 2);
                ctx.stroke();

            } else if (e.type === 'catpaw') {
                ctx.scale(e.fromLeft ? 1 : -1, 1);
                ctx.fillStyle = '#fef3c7';
                ctx.strokeStyle = '#d97706';
                ctx.lineWidth = 2.5;
                ctx.beginPath();
                ctx.roundRect(-180, -16, 185, 32, 16);
                ctx.fill();
                ctx.stroke();

                ctx.fillStyle = '#f59e0b';
                for (let s = -140; s <= -35; s += 35) {
                    ctx.fillRect(s, -15, 10, 12);
                }

                ctx.fillStyle = '#fb7185';
                ctx.beginPath();
                ctx.arc(0, 0, 7, 0, Math.PI * 2);
                ctx.fill();
                [[-7, -9], [2, -10], [8, -4], [4, 8]].forEach(([px, py]) => {
                    ctx.beginPath();
                    ctx.arc(px, py, 3.2, 0, Math.PI * 2);
                    ctx.fill();
                });

            } else if (e.type === 'fan') {
                const dir = e.blowRight ? 1 : -1;
                ctx.strokeStyle = 'rgba(56, 189, 248, 0.55)';
                ctx.lineWidth = 2;
                ctx.setLineDash([8, 8]);
                for (let row = -16; row <= 16; row += 16) {
                    ctx.beginPath();
                    ctx.moveTo(dir * 26, row);
                    ctx.lineTo(dir * (width * 0.65), row);
                    ctx.stroke();
                }
                ctx.setLineDash([]);

                ctx.fillStyle = '#e0f2fe';
                ctx.strokeStyle = '#0284c7';
                ctx.lineWidth = 2.5;
                ctx.beginPath();
                ctx.arc(0, 0, 22, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();

                ctx.save();
                ctx.rotate(e.bladeAngle);
                ctx.fillStyle = '#38bdf8';
                for (let b = 0; b < 3; b++) {
                    ctx.rotate((Math.PI * 2) / 3);
                    ctx.beginPath();
                    ctx.ellipse(0, -9, 4, 8, 0, 0, Math.PI * 2);
                    ctx.fill();
                }
                ctx.restore();

            } else if (e.type === 'repair' || e.type === 'gold') {
                const isG = e.type === 'gold';
                ctx.scale(1 + Math.sin(e.bob) * 0.09, 1 + Math.sin(e.bob) * 0.09);
                ctx.fillStyle = isG ? '#fef3c7' : '#d1fae5';
                ctx.strokeStyle = isG ? '#f59e0b' : '#10b981';
                ctx.lineWidth = isG ? 3 : 2.5;
                ctx.beginPath();
                ctx.arc(0, 0, e.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();

                ctx.fillStyle = isG ? '#fbbf24' : '#ffffff';
                ctx.strokeStyle = isG ? '#b45309' : '#059669';
                ctx.lineWidth = 1.8;
                ctx.beginPath();
                ctx.roundRect(-10, -8, 20, 16, 4);
                ctx.fill();
                ctx.stroke();

                ctx.font = '800 10px "M PLUS Rounded 1c", sans-serif';
                ctx.fillStyle = isG ? '#b45309' : '#047857';
                ctx.textAlign = 'center';
                ctx.fillText(isG ? '+5m' : '回復', 0, 16);

            } else if (e.type === 'star') {
                const sc = 1 + Math.sin(e.bob) * 0.14;
                ctx.scale(sc, sc);
                ctx.shadowColor = `hsl(${rainbowHue}, 95%, 55%)`;
                ctx.shadowBlur = 12;
                ctx.fillStyle = 'rgba(255, 255, 255, 0.92)';
                ctx.strokeStyle = `hsl(${rainbowHue}, 90%, 55%)`;
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.arc(0, 0, e.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();

                ctx.save();
                ctx.rotate(Math.sin(e.spin) * 0.25);
                drawStarShape(ctx, 0, 0, 5, 15, 7);
                ctx.fillStyle = '#facc15';
                ctx.fill();
                ctx.lineWidth = 2;
                ctx.strokeStyle = '#ca8a04';
                ctx.stroke();
                ctx.fillStyle = '#1e293b';
                ctx.fillRect(-3.5, -3, 2, 4.5);
                ctx.fillRect(1.5, -3, 2, 4.5);
                ctx.restore();
            }

            ctx.restore();
        }

        function gameLoop(timestamp) {
            if (!lastTime) lastTime = timestamp;
            const dt = Math.min(0.05, (timestamp - lastTime) / 1000);
            lastTime = timestamp;

            update(dt);
            draw();

            requestAnimationFrame(gameLoop);
        }

        function handlePointerDown(e) {
            if (gameState !== 'PLAYING') return;
            sound.init();
            input.isPointerDown = true;
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            input.lastPointerX = clientX;
            touchHint.classList.add('hidden');
        }

        function handlePointerMove(e) {
            if (gameState !== 'PLAYING' || !input.isPointerDown) return;
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const deltaX = clientX - input.lastPointerX;
            input.lastPointerX = clientX;
            paper.targetX += deltaX * 1.15;
        }

        function handlePointerUp() {
            input.isPointerDown = false;
        }

        canvas.addEventListener('touchstart', handlePointerDown, { passive: true });
        canvas.addEventListener('touchmove', handlePointerMove, { passive: true });
        canvas.addEventListener('touchend', handlePointerUp);
        canvas.addEventListener('touchcancel', handlePointerUp);

        canvas.addEventListener('mousedown', handlePointerDown);
        window.addEventListener('mousemove', handlePointerMove);
        window.addEventListener('mouseup', handlePointerUp);

        window.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') input.leftPressed = true;
            if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') input.rightPressed = true;
        });
        window.addEventListener('keyup', (e) => {
            if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') input.leftPressed = false;
            if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') input.rightPressed = false;
        });

        startBtn.addEventListener('click', startGame);
        retryBtn.addEventListener('click', startGame);

        soundToggleBtn.addEventListener('click', () => {
            sound.init();
            const isMuted = sound.toggleMute();
            soundOnIcon.classList.toggle('hidden', isMuted);
            soundOffIcon.classList.toggle('hidden', !isMuted);
        });

        document.querySelectorAll('[data-reset-trigger]').forEach(btn => {
            btn.addEventListener('click', () => {
                resetConfirmModal.classList.remove('hidden');
            });
        });

        cancelResetBtn.addEventListener('click', () => {
            resetConfirmModal.classList.add('hidden');
        });

        confirmResetBtn.addEventListener('click', () => {
            lastRecordedEntryId = null;
            clearRanking();
            resetConfirmModal.classList.add('hidden');
            showToast('TOP 5 ランキングをリセットしました');
        });

        shareBtn.addEventListener('click', () => {
            const roundedDist = Math.round(distance * 10) / 10;
            const shareScore = Math.floor(roundedDist * 10);
            const shareText = `🧻 トイレットペーパー・ロングランで【${roundedDist.toFixed(1)}m / ${shareScore}点】達成！（1位記録: ${getTopScore().toFixed(1)}m） #トイレットペーパーゲーム`;
            const tempInput = document.createElement('textarea');
            tempInput.value = shareText;
            document.body.appendChild(tempInput);
            tempInput.select();
            try {
                document.execCommand('copy');
                showToast('クリップボードにコピーしました！');
            } catch (err) {
                showToast('コピーできませんでした');
            }
            document.body.removeChild(tempInput);
        });

        window.addEventListener('resize', resizeCanvas);
        window.onload = function () {
            renderRankingBoards();
            updateBestScoreUI();
            resizeCanvas();
            requestAnimationFrame(gameLoop);
        };
    </script>
</body>
