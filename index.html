<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>トイレットペーパー・ロングラン</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; touch-action: none; background: #e0f2fe; }
    canvas { display: block; width: 100%; height: 100%; }
  </style>
</head>
<body class="flex items-center justify-center">
  <div id="wrap" class="relative w-full h-full max-w-md bg-sky-50 overflow-hidden shadow-xl">
    <canvas id="c"></canvas>

    <div id="hud" class="hidden absolute top-3 left-3 right-3 flex justify-between items-center pointer-events-none">
      <div class="bg-white/90 px-3 py-1.5 rounded-2xl border-2 border-sky-300 font-bold text-slate-800">
        長さ: <span id="dist" class="text-sky-600 text-lg">0.0</span>m / スコア: <span id="score" class="text-indigo-600 text-lg">0</span>
      </div>
      <div class="bg-white/90 px-3 py-1.5 rounded-2xl border-2 border-amber-300 font-bold text-amber-800">
        1位: <span id="best">0.0</span>m
      </div>
    </div>

    <div id="startOverlay" class="absolute inset-0 bg-sky-900/30 flex items-center justify-center p-4">
      <div class="bg-white rounded-3xl p-6 w-full max-w-sm text-center border-4 border-sky-200 shadow-xl">
        <h1 class="text-2xl font-black text-slate-800 mb-2">🧻 トイレットペーパー<br><span class="text-sky-500">ロングラン！</span></h1>
        <p class="text-xs text-slate-500 font-bold mb-4">左右にスライドして紙を伸ばそう！</p>
        <button id="startBtn" type="button" class="w-full py-3.5 bg-sky-500 hover:bg-sky-400 text-white font-black text-lg rounded-2xl shadow">
          ゲームスタート！
        </button>
      </div>
    </div>

    <div id="overOverlay" class="hidden absolute inset-0 bg-slate-900/50 flex items-center justify-center p-4">
      <div class="bg-white rounded-3xl p-6 w-full max-w-sm text-center border-4 border-rose-200 shadow-2xl">
        <h2 class="text-xl font-black text-slate-800 mb-2">ビリッ！ちぎれた！</h2>
        <p class="text-3xl font-black text-sky-600 mb-4"><span id="finalDist">0.0</span>m</p>
        <button id="retryBtn" type="button" class="w-full py-3 bg-emerald-500 hover:bg-emerald-400 text-white font-black rounded-2xl shadow">
          もう一度遊ぶ
        </button>
      </div>
    </div>
  </div>

  <script>
    const wrap = document.getElementById('wrap');
    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d');
    const startOverlay = document.getElementById('startOverlay');
    const overOverlay = document.getElementById('overOverlay');
    const hud = document.getElementById('hud');
    const distEl = document.getElementById('dist');
    const scoreEl = document.getElementById('score');
    const bestEl = document.getElementById('best');
    const finalDistEl = document.getElementById('finalDist');

    let w = 360, h = 640, state = 'START', distance = 0, best = 0;
    let paperX = 180, targetX = 180, dragging = false, lastX = 0, items = [], spawnT = 0, lastTs = 0;

    try { best = parseFloat(localStorage.getItem('tp_best_simple') || '0') || 0; } catch(e) {}
    bestEl.textContent = best.toFixed(1);

    function resize() {
      const r = wrap.getBoundingClientRect();
      w = Math.max(260, r.width);
      h = Math.max(400, r.height);
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      canvas.width = w * dpr;
      canvas.height = h * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      paperX = targetX = w / 2;
    }

    function startGame() {
      state = 'PLAY';
      distance = 0;
      paperX = targetX = w / 2;
      items = [];
      spawnT = 0.5;
      startOverlay.classList.add('hidden');
      overOverlay.classList.add('hidden');
      hud.classList.remove('hidden');
    }

    function gameOver() {
      state = 'OVER';
      const d = Math.round(distance * 10) / 10;
      if (d > best) {
        best = d;
        try { localStorage.setItem('tp_best_simple', String(best)); } catch(e) {}
        bestEl.textContent = best.toFixed(1);
      }
      finalDistEl.textContent = d.toFixed(1);
      overOverlay.classList.remove('hidden');
    }

    function loop(ts) {
      if (!lastTs) lastTs = ts;
      const dt = Math.min(0.05, (ts - lastTs) / 1000);
      lastTs = ts;

      if (state === 'PLAY') {
        const spd = 240 + distance * 2.5;
        distance += (spd / 45) * dt;
        paperX += (targetX - paperX) * Math.min(1, dt * 16);
        paperX = Math.max(24, Math.min(w - 24, paperX));

        spawnT -= dt;
        if (spawnT <= 0) {
          spawnT = Math.max(0.45, 1.0 - distance * 0.005);
          items.push({ x: 36 + Math.random() * (w - 72), y: h + 30, r: 22 });
        }

        const py = h * 0.45;
        for (let i = items.length - 1; i >= 0; i--) {
          const it = items[i];
          it.y -= spd * dt;
          if (Math.hypot(it.x - paperX, it.y - py) < it.r + 14) {
            gameOver();
            break;
          }
          if (it.y < -40) items.splice(i, 1);
        }

        distEl.textContent = distance.toFixed(1);
        scoreEl.textContent = String(Math.floor(distance * 10));
      }

      ctx.clearRect(0, 0, w, h);
      // ロール
      ctx.fillStyle = '#ffffff';
      ctx.strokeStyle = '#94a3b8';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.roundRect(w / 2 - 42, 85, 84, 52, 8);
      ctx.fill();
      ctx.stroke();

      // 紙リボン
      const py = h * 0.45;
      ctx.beginPath();
      ctx.moveTo(w / 2 - 16, 137);
      ctx.lineTo(paperX - 16, py);
      ctx.lineTo(paperX + 16, py);
      ctx.lineTo(w / 2 + 16, 137);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      // 障害物
      items.forEach(it => {
        ctx.fillStyle = '#38bdf8';
        ctx.strokeStyle = '#0284c7';
        ctx.beginPath();
        ctx.arc(it.x, it.y, it.r, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
      });

      requestAnimationFrame(loop);
    }

    canvas.addEventListener('pointerdown', e => { dragging = true; lastX = e.clientX; });
    window.addEventListener('pointermove', e => {
      if (!dragging || state !== 'PLAY') return;
      targetX += (e.clientX - lastX) * 1.1;
      lastX = e.clientX;
    });
    window.addEventListener('pointerup', () => { dragging = false; });

    document.getElementById('startBtn').addEventListener('click', startGame);
    document.getElementById('retryBtn').addEventListener('click', startGame);
    window.addEventListener('resize', resize);
    resize();
    requestAnimationFrame(loop);
  </script>
</body>
</html>
