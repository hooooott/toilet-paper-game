<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>トイレペーパー ロングラン！</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #e8f0f7;
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
      color: #1f2937;
    }
    #app {
      position: relative;
      width: 100%;
      max-width: 480px;
      height: 100dvh;
      margin: 0 auto;
      background: #ffffff;
      box-shadow: 0 0 24px rgba(0, 0, 0, 0.12);
      overflow: hidden;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    .hud {
      position: absolute;
      top: 10px;
      left: 10px;
      right: 10px;
      z-index: 10;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 8px;
      pointer-events: none;
    }
    .hud-box {
      background: rgba(255, 255, 255, 0.92);
      border: 2px solid #cbd5e1;
      border-radius: 12px;
      padding: 6px 10px;
      font-size: 12px;
      font-weight: 700;
      line-height: 1.35;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.08);
    }
    .hud-val {
      font-size: 16px;
      color: #0284c7;
    }
    .durability-wrap {
      position: absolute;
      top: 66px;
      left: 10px;
      right: 10px;
      z-index: 10;
      background: rgba(255, 255, 255, 0.92);
      border: 2px solid #cbd5e1;
      border-radius: 12px;
      padding: 6px 10px;
      pointer-events: none;
    }
    .durability-label {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      font-weight: 700;
      margin-bottom: 4px;
    }
    .bar-bg {
      width: 100%;
      height: 10px;
      background: #e2e8f0;
      border-radius: 999px;
      overflow: hidden;
    }
    .bar-fill {
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, #22c55e, #eab308);
      transition: width 0.08s linear, background 0.2s ease;
    }
    .overlay {
      position: absolute;
      inset: 0;
      z-index: 20;
      background: rgba(248, 250, 252, 0.94);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 20px;
      gap: 12px;
    }
    .overlay.hidden {
      display: none;
    }
    h1 {
      margin: 0;
      font-size: 24px;
      line-height: 1.3;
      color: #0f172a;
    }
    .desc {
      margin: 0;
      font-size: 13px;
      line-height: 1.6;
      color: #475569;
    }
    .rules {
      text-align: left;
      background: #f1f5f9;
      border-radius: 12px;
      padding: 12px 14px;
      font-size: 12px;
      line-height: 1.65;
      color: #334155;
      width: 100%;
    }
    .btn {
      border: none;
      border-radius: 999px;
      padding: 14px 28px;
      font-size: 16px;
      font-weight: 800;
      color: #ffffff;
      background: linear-gradient(135deg, #0284c7, #2563eb);
      box-shadow: 0 6px 16px rgba(37, 99, 235, 0.35);
      cursor: pointer;
    }
    .btn:active {
      transform: scale(0.97);
    }
  </style>
</head>
<body>
  <div id="app">
    <div class="hud">
      <div class="hud-box">
        のばした長さ<br />
        <span id="scoreText" class="hud-val">0.0m</span>
      </div>
      <div class="hud-box" style="text-align: right;">
        1位記録<br />
        <span id="bestText" class="hud-val">0.0m</span>
      </div>
    </div>

    <div class="durability-wrap">
      <div class="durability-label">
        <span>🧻 紙の耐久度（急な横移動はちぎれ注意！）</span>
        <span id="durText">100%</span>
      </div>
      <div class="bar-bg">
        <div id="durBar" class="bar-fill"></div>
      </div>
    </div>

    <canvas id="gameCanvas"></canvas>

    <div id="startOverlay" class="overlay">
      <h1>🧻 トイレペーパー<br />ロングラン！</h1>
      <p class="desc">どこまで切らずに伸ばせるかな？</p>
      <div class="rules">
        👆 左右にスライド（PCは左右キー/マウス）して紙を誘導<br />
        ⚠️ 急に大きく動かすと紙が傷んで耐久度が減るよ<br />
        ⭐ 無敵スターでレインボー無敵化！障害物を吹き飛ばせる！
      </div>
      <button id="startBtn" class="btn">ゲームスタート</button>
    </div>

    <div id="gameOverOverlay" class="overlay hidden">
      <h1 id="endTitle">紙がちぎれた！</h1>
      <p class="desc" id="endScore">今回の記録：0.0m</p>
      <p class="desc" id="endBest">自己ベスト：0.0m</p>
      <button id="retryBtn" class="btn">もう一度遊ぶ</button>
    </div>
  </div>

  <script>
    (() => {
      const canvas = document.getElementById("gameCanvas");
      const ctx = canvas.getContext("2d");
      const app = document.getElementById("app");

      const scoreText = document.getElementById("scoreText");
      const bestText = document.getElementById("bestText");
      const durText = document.getElementById("durText");
      const durBar = document.getElementById("durBar");
      const startOverlay = document.getElementById("startOverlay");
      const gameOverOverlay = document.getElementById("gameOverOverlay");
      const startBtn = document.getElementById("startBtn");
      const retryBtn = document.getElementById("retryBtn");
      const endTitle = document.getElementById("endTitle");
      const endScore = document.getElementById("endScore");
      const endBest = document.getElementById("endBest");

      const BEST_KEY = "tp_longrun_best_v1";
      let bestMeters = parseFloat(localStorage.getItem(BEST_KEY) || "0") || 0;
      bestText.textContent = bestMeters.toFixed(1) + "m";

      let width = 360;
      let height = 640;
      let dpr = 1;

      function resize() {
        const rect = app.getBoundingClientRect();
        width = Math.max(280, rect.width);
        height = Math.max(420, rect.height);
        dpr = Math.min(window.devicePixelRatio || 1, 2);
        canvas.width = Math.floor(width * dpr);
        canvas.height = Math.floor(height * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      }
      resize();
      window.addEventListener("resize", resize);

      let state = "title"; // "title" | "playing" | "gameover"
      let distanceMeters = 0;
      let durability = 100;
      let speed = 210; // px/sec
      let starTimer = 0;
      let hue = 0;

      // 紙の先端位置
      let paperX = width * 0.5;
      let targetX = width * 0.5;
      let prevPaperX = width * 0.5;
      const paperY = () => Math.min(height * 0.72, height - 130);
      const paperWidth = 64;

      // 障害物・アイテム配列
      let entities = [];
      let spawnTimer = 0;
      let lastTime = performance.now();

      function resetGame() {
        distanceMeters = 0;
        durability = 100;
        speed = 210;
        starTimer = 0;
        paperX = width * 0.5;
        targetX = width * 0.5;
        prevPaperX = width * 0.5;
        entities = [];
        spawnTimer = 0.4;
        updateHud();
      }

      function updateHud() {
        scoreText.textContent = distanceMeters.toFixed(1) + "m";
        if (distanceMeters > bestMeters) {
          bestMeters = distanceMeters;
          localStorage.setItem(BEST_KEY, bestMeters.toFixed(1));
        }
        bestText.textContent = bestMeters.toFixed(1) + "m";

        const d = Math.max(0, Math.min(100, durability));
        durText.textContent = Math.round(d) + "%";
        durBar.style.width = d + "%";
        if (d > 50) {
          durBar.style.background = "linear-gradient(90deg, #22c55e, #84cc16)";
        } else if (d > 25) {
          durBar.style.background = "linear-gradient(90deg, #eab308, #f97316)";
        } else {
          durBar.style.background = "#ef4444";
        }
      }

      function startGame() {
        resize();
        resetGame();
        state = "playing";
        startOverlay.classList.add("hidden");
        gameOverOverlay.classList.add("hidden");
      }

      function gameOver(reason) {
        if (state !== "playing") return;
        state = "gameover";
        updateHud();
        endTitle.textContent = reason || "紙がちぎれた！";
        endScore.textContent = "今回の記録：" + distanceMeters.toFixed(1) + "m";
        endBest.textContent = "自己ベスト：" + bestMeters.toFixed(1) + "m";
        gameOverOverlay.classList.remove("hidden");
      }

      startBtn.addEventListener("click", startGame);
      retryBtn.addEventListener("click", startGame);

      // ポインター操作（スマホタッチ＆マウスドラッグ）
      let dragging = false;
      function setTargetFromClientX(clientX) {
        const rect = canvas.getBoundingClientRect();
        const x = clientX - rect.left;
        const margin = paperWidth * 0.5 + 16;
        targetX = Math.max(margin, Math.min(width - margin, x));
      }

      canvas.addEventListener("pointerdown", (e) => {
        if (state !== "playing") return;
        dragging = true;
        setTargetFromClientX(e.clientX);
      });
      window.addEventListener("pointermove", (e) => {
        if (!dragging || state !== "playing") return;
        setTargetFromClientX(e.clientX);
      });
      window.addEventListener("pointerup", () => {
        dragging = false;
      });

      // キーボード操作（PC用）
      const keys = { left: false, right: false };
      window.addEventListener("keydown", (e) => {
        if (e.key === "ArrowLeft" || e.key === "a" || e.key === "A") keys.left = true;
        if (e.key === "ArrowRight" || e.key === "d" || e.key === "D") keys.right = true;
      });
      window.addEventListener("keyup", (e) => {
        if (e.key === "ArrowLeft" || e.key === "a" || e.key === "A") keys.left = false;
        if (e.key === "ArrowRight" || e.key === "d" || e.key === "D") keys.right = false;
      });

      function spawnEntity() {
        const margin = 36;
        const x = margin + Math.random() * Math.max(40, width - margin * 2);
        const r = Math.random();
        if (r < 0.16) {
          entities.push({ type: "star", x, y: -24, size: 28, vy: speed });
        } else if (r < 0.32) {
          entities.push({ type: "roll", x, y: -24, size: 28, vy: speed });
        } else {
          entities.push({ type: "spike", x, y: -24, size: 32, vy: speed });
        }
      }

      function drawBackground() {
        ctx.fillStyle = "#f8fafc";
        ctx.fillRect(0, 0, width, height);

        // 方眼グリッド
        ctx.strokeStyle = "#e2e8f0";
        ctx.lineWidth = 1;
        const step = 28;
        const offsetY = (distanceMeters * 60) % step;
        for (let x = 0; x <= width; x += step) {
          ctx.beginPath();
          ctx.moveTo(x, 0);
          ctx.lineTo(x, height);
          ctx.stroke();
        }
        for (let y = offsetY; y <= height; y += step) {
          ctx.beginPath();
          ctx.moveTo(0, y);
          ctx.lineTo(width, y);
          ctx.stroke();
        }
      }

      function drawPaper() {
        const py = paperY();
        const left = paperX - paperWidth / 2;

        // 紙の帯（上から先端まで）
        if (starTimer > 0) {
          ctx.fillStyle = `hsl(${hue}, 90%, 62%)`;
        } else {
          ctx.fillStyle = "#ffffff";
        }
        ctx.fillRect(left, 0, paperWidth, py);

        // 紙の輪郭とミシン目
        ctx.strokeStyle = starTimer > 0 ? "#b45309" : "#94a3b8";
        ctx.lineWidth = 2;
        ctx.strokeRect(left, 0, paperWidth, py);

        ctx.setLineDash([5, 5]);
        ctx.strokeStyle = "#cbd5e1";
        const perfStep = 48;
        const perfOffset = (distanceMeters * 60) % perfStep;
        for (let y = perfOffset; y < py; y += perfStep) {
          ctx.beginPath();
          ctx.moveTo(left + 4, y);
          ctx.lineTo(left + paperWidth - 4, y);
          ctx.stroke();
        }
        ctx.setLineDash([]);

        // 先端のロール（芯）
        ctx.beginPath();
        ctx.ellipse(paperX, py, paperWidth / 2, 11, 0, 0, Math.PI * 2);
        ctx.fillStyle = starTimer > 0 ? `hsl(${(hue + 180) % 360}, 95%, 55%)` : "#f1f5f9";
        ctx.fill();
        ctx.strokeStyle = "#475569";
        ctx.lineWidth = 2;
        ctx.stroke();

        ctx.beginPath();
        ctx.ellipse(paperX, py, 9, 4, 0, 0, Math.PI * 2);
        ctx.fillStyle = "#cbd5e1";
        ctx.fill();
      }

      function drawEntities() {
        for (const ent of entities) {
          if (ent.type === "spike") {
            // トゲ障害物（赤三角）
            ctx.fillStyle = "#ef4444";
            ctx.beginPath();
            ctx.moveTo(ent.x, ent.y - ent.size * 0.55);
            ctx.lineTo(ent.x - ent.size * 0.5, ent.y + ent.size * 0.45);
            ctx.lineTo(ent.x + ent.size * 0.5, ent.y + ent.size * 0.45);
            ctx.closePath();
            ctx.fill();
            ctx.strokeStyle = "#991b1b";
            ctx.lineWidth = 2;
            ctx.stroke();
          } else if (ent.type === "star") {
            // 無敵スター
            ctx.font = "26px sans-serif";
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            ctx.fillText("⭐", ent.x, ent.y);
          } else if (ent.type === "roll") {
            // 耐久回復ロール
            ctx.font = "26px sans-serif";
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            ctx.fillText("🧻", ent.x, ent.y);
          }
        }
      }

      function loop(now) {
        const dt = Math.min(0.05, (now - lastTime) / 1000);
        lastTime = now;
        hue = (hue + dt * 240) % 360;

        if (state === "playing") {
          if (keys.left) targetX -= 320 * dt;
          if (keys.right) targetX += 320 * dt;
          const margin = paperWidth * 0.5 + 16;
          targetX = Math.max(margin, Math.min(width - margin, targetX));

          prevPaperX = paperX;
          paperX += (targetX - paperX) * Math.min(1, dt * 16);

          // 急な横移動による耐久度減少
          const moveSpeed = Math.abs(paperX - prevPaperX) / Math.max(dt, 0.001);
          if (moveSpeed > 420 && starTimer <= 0) {
            durability -= (moveSpeed - 420) * 0.035 * dt;
          }

          speed = Math.min(440, 210 + distanceMeters * 2.2);
          distanceMeters += (speed * dt) / 55;

          if (starTimer > 0) {
            starTimer = Math.max(0, starTimer - dt);
          }

          spawnTimer -= dt;
          if (spawnTimer <= 0) {
            spawnEntity();
            spawnTimer = Math.max(0.42, 0.95 - distanceMeters * 0.008);
          }

          const py = paperY();
          const halfW = paperWidth * 0.45;
          const nextEntities = [];

          for (const ent of entities) {
            ent.y += speed * dt;
            const hitX = Math.abs(ent.x - paperX) < halfW + ent.size * 0.4;
            const hitY = Math.abs(ent.y - py) < ent.size * 0.55 + 12;

            if (hitX && hitY) {
              if (ent.type === "star") {
                starTimer = 5.0;
                continue;
              } else if (ent.type === "roll") {
                durability = Math.min(100, durability + 25);
                continue;
              } else if (ent.type === "spike") {
                if (starTimer > 0) {
                  // 無敵中は吹き飛ばす
                  continue;
                } else {
                  durability -= 35;
                  continue;
                }
              }
            }

            if (ent.y < height + 50) {
              nextEntities.push(ent);
            }
          }
          entities = nextEntities;

          updateHud();
          if (durability <= 0) {
            gameOver("紙がちぎれた！");
          }
        }

        drawBackground();
        drawPaper();
        drawEntities();
        requestAnimationFrame(loop);
      }

      requestAnimationFrame(loop);
    })();
  </script>
</body>
</html>
